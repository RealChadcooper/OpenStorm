name: Backend CI

on:
  push:
    branches: [main]
    paths: ['backend/**']
  pull_request:
    branches: [main]
    paths: ['backend/**']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew || true
        working-directory: .

      - name: Build
        run: ./gradlew build
        working-directory: backend

      - name: Run tests
        run: ./gradlew test
        working-directory: backend

      - name: Build fat JAR
        run: ./gradlew buildFatJar
        working-directory: backend

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/openstorm-backend.jar
